services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  # Not exposed outside — only reachable within drgodly-net
  postgres:
    image: postgres:16-alpine
    container_name: drgodly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-drgodly}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: drgodly_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drgodly-net
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-drgodly} -d drgodly_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── App ─────────────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/naveenraj-g/drgodly:latest
    container_name: drgodly
    restart: unless-stopped
    env_file:
      - .env.vps
    volumes:
      - /root/drgodly/logs:/app/logs
      - /root/drgodly/uploads:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - drgodly-net
    depends_on:
      postgres:
        condition: service_healthy

# ─── Creates drgodly_telemedicine on first postgres start ─────────────────────
configs:
  init_db:
    content: |
      CREATE DATABASE drgodly_telemedicine;

volumes:
  postgres_data:

networks:
  drgodly-net:
    external: true
